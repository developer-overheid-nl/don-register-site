publiccodeYmlVersion: "0.5"
name: developer.overheid.nl Register Sites
applicationSuite: developer.overheid.nl API-, OSS- and Schema registers
url: https://github.com/developer-overheid-nl/don-register-site

platforms:
  - web

categories:
  - data-collection
  - data-visualization
  - it-development
  - project-management

developmentStatus: stable
softwareType: standalone/web

description:
  nl:
    localisedName: Websites voor developer.overheid.nl API-, OSS- en Schema-registers
    shortDescription: De websites en packages van het API-, OSS- en Schema-register van developer.overheid.nl en het register-site-template
    longDescription: >-
      Deze monorepo bevat de websites van het [API-register](https://apis.developer.overheid.nl), het [OSS-register](https://oss.developer.overheid.nl) en het [Schema-register](https://schemas.developer.overheid.nl). Deze registers
      worden ontsloten vanuit een REST API.

      De codebase bestaat uit een aantal packages die de gezamenlijke codebase (components, layouts, etc) vormen en een `apps`-package waarin de verschillende websites staan.
      Deze packages worden ook gebruikt in het [register-site-template](https://github.com/developer-overheid-nl/register-site-template).
    features:
      - informatie
      - componenten
      - layouts
  en:
    localisedName: Websites for developer.overheid.nl API-, OSS- and Schema registers
    shortDescription: The websites and packages belonging to the API-, OSS- and Schema-register from developer.overheid.nl and the register-site-template

