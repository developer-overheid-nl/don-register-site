name: Deploy to Test

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - "changeset-release/**"
      - "changesets-ghcommit-temp/**"

jobs:
  deploy:
    uses: developer-overheid-nl/.github/.github/workflows/deploy.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      environment: test
      infra-repo: ${{ vars.INFRA_REPO }}
      images: >-
        [
          {"name": "ghcr.io/developer-overheid-nl/don-register-site", "target": "runtime-api", "kustomize-path": "${{ vars.KUSTOMIZE_PATH_API }}"},
          {"name": "ghcr.io/developer-overheid-nl/don-register-oss-site", "target": "runtime-oss", "kustomize-path": "${{ vars.KUSTOMIZE_PATH_OSS }}"},
          {"name": "ghcr.io/developer-overheid-nl/don-register-schema-site", "target": "runtime-schema", "kustomize-path": "${{ vars.KUSTOMIZE_PATH_SCHEMA }}"}
        ]
    secrets: inherit
