packages:
  - apps/*
  - packages/*
  - proprietary*

catalog:
  "@astrojs/markdown-satteri": 0.4.6
  "@astrojs/mdx": 8.1.2
  "@astrojs/node": 11.1.9
  "@astrojs/react": 7.1.2
  "@csstools/postcss-global-data": 4.0.0
  "@piwikpro/react-piwik-pro": 3.0.0
  # RHC umbrella packages: components-css holds styles that have no separate package
  # (form-field, form-field-select, table, …); components-react holds FormField* and Table*.
  "@rijkshuisstijl-community/components-css": 18.0.2
  "@rijkshuisstijl-community/components-react": 17.0.1
  "@rijkshuisstijl-community/design-tokens": 18.0.1
  # RHC per-component packages: keep versions in sync with what components-react pins,
  # so pnpm installs a single copy of each.
  "@rijkshuisstijl-community/accordion-react": 3.1.3
  "@rijkshuisstijl-community/alert-react": 3.1.4
  "@rijkshuisstijl-community/article-react": 2.1.3
  "@rijkshuisstijl-community/button-react": 1.1.4
  "@rijkshuisstijl-community/card-as-link-react": 1.1.3
  "@rijkshuisstijl-community/data-badge-button-react": 1.0.3
  "@rijkshuisstijl-community/data-summary-item-react": 1.0.3
  "@rijkshuisstijl-community/data-summary-react": 1.0.2
  "@rijkshuisstijl-community/fieldset-react": 1.0.2
  # Footer is pinned to the old design (1.x); npm "latest" (0.0.x) is the new slot-based footer.
  "@rijkshuisstijl-community/footer-css": 1.0.1
  "@rijkshuisstijl-community/footer-react": 1.0.3
  "@rijkshuisstijl-community/heading-group-react": 1.0.2
  "@rijkshuisstijl-community/heading-react": 1.0.3
  "@rijkshuisstijl-community/icon-react": 3.1.3
  "@rijkshuisstijl-community/link-button-react": 1.0.3
  "@rijkshuisstijl-community/link-list-react": 1.1.1
  "@rijkshuisstijl-community/link-react": 1.1.3
  "@rijkshuisstijl-community/navigation-bar-react": 1.0.4
  "@rijkshuisstijl-community/paragraph-react": 2.1.3
  "@rijkshuisstijl-community/radio-react": 1.0.3
  "@rijkshuisstijl-community/text-input-react": 1.0.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@utrecht/component-library-css": 9.0.12
  "@vitest/browser-playwright": 4.1.9
  "@vitest/coverage-v8": 4.1.9
  altcha: 3.3.0
  altcha-lib: 2.2.0
  astro: 7.4.4
  clsx: 2.1.1
  dotenv-cli: 11.0.0
  i18next: 26.5.12
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  postcss-custom-media: 12.0.1
  react: 19.3.1
  react-dom: 19.3.1
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  typescript: 5.9.3
  vite: 8.3.2
  vitest: 4.1.9

catalogs:
  react18:
    "@types/react": ">=18 <19"
    "@types/react-dom": ">=18 <19"
    react: 18.2.0 <19.0.0
    react-dom: 18.2.0 <19.0.0
  react19:
    "@types/react": ">=19.2 <19.3"
    "@types/react-dom": ">=19.2 <19.3"
    react: 19.2.3
    react-dom: 19.2.3

overrides:
  # Keep the old footer design inside the RHC umbrella as well. Also works around footer-react@0.0.2,
  # whose /no-side-effects entry imports separator-react's CSS, crashing Astro SSR ("Unknown file extension .css").
  "@rijkshuisstijl-community/components-react>@rijkshuisstijl-community/footer-react": 1.0.3
  "@ungap/structured-clone": 1.3.1 # Fixes a security vulnerability in versions <1.3.1
  "@utrecht/button-group-css": 2.0.1
  react: catalog:react19
  react-dom: catalog:react19

ignoredBuiltDependencies:
  - sharp

onlyBuiltDependencies:
  - cypress
  - esbuild
  - lefthook
